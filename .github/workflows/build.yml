name: Build NDS ROM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ROM
        run: |
          # 激活 devkitARM 环境（绝对正确的路径）
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${DEVKITPRO}/tools/bin:$PATH

          # 编译
          arm-none-eabi-gcc -g -Wall -O2 \
            -march=armv5te -mtune=arm946e-s -fomit-frame-pointer \
            -ffast-math -mthumb -mthumb-interwork -DARM9 \
            -I${DEVKITPRO}/libnds/include \
            -c donttap.c -o donttap.o

          # 链接
          arm-none-eabi-gcc \
            -specs=ds_arm9.specs -g -mthumb -mthumb-interwork \
            -L${DEVKITPRO}/libnds/lib \
            -o donttap.elf donttap.o -lnds9

          # 打包成 .nds
          ndstool -c donttap.nds -9 donttap.elf

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: donttap-nds
          path: donttap.nds
